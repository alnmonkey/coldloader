[package]
name = "coldloader"
version = "1.4.0"
edition = "2024"
authors = ["NotAndreh"]

[lib]
name = "coldloader"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
log = { version = "0.4", features = ["release_max_level_off"] }
log4rs = "1"
rust-ini = "0.21"
windows = { version = "0.62.2", features = ["Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62.2"
winreg = "0.56"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"
